services:
  pricing-agent:
    build: ./agents/pricing-agent
    ports: ["8001:8000"]
    env_file: [.env]
  apriori-service:
    build: ./apriori-service
    ports: ["8002:8000"]
    env_file: [.env]
  recommender-service:
    build: ./recommender-service
    ports: ["8003:8000"]
    environment:
      DATABASE_URL: ${DATABASE_URL}
    env_file: [.env]
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports: ["5432:5432"]
    volumes: [mall-data:/var/lib/postgresql/data]
volumes:
  mall-data:
