services:
  pricing-agent:
    build: ./agents/pricing-agent
    ports: ["8001:8000"]
  apriori-service:
    build: ./apriori-service
    ports: ["8002:8000"]
  recommender-service:
    build: ./recommender-service
    ports: ["8003:8000"]
    environment:
      DATABASE_PATH: /data/mall.db
      DEMO_DATA_SEED: ${DEMO_DATA_SEED:-20260927}
      DEMO_CUSTOMER_COUNT: ${DEMO_CUSTOMER_COUNT:-120}
      DEMO_PRODUCT_COUNT: ${DEMO_PRODUCT_COUNT:-150}
      DEMO_COMPLETED_TRANSACTION_COUNT: ${DEMO_COMPLETED_TRANSACTION_COUNT:-150}
      DEMO_PENDING_TRANSACTION_COUNT: ${DEMO_PENDING_TRANSACTION_COUNT:-35}
      DEMO_STORE_COUNT: ${DEMO_STORE_COUNT:-20}
      MALL_NAME: ${MALL_NAME:-Intelligent Mall}
      DEMO_ADMIN_ID: ${DEMO_ADMIN_ID:-ADMIN-001}
      DEMO_ADMIN_NAME: ${DEMO_ADMIN_NAME:-Mall Administrator}
      DEMO_ADMIN_EMAIL: ${DEMO_ADMIN_EMAIL:-admin@example.test}
      DEMO_MANAGER_NAME: ${DEMO_MANAGER_NAME:-Store Manager}
    volumes:
      - mall-data:/data
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports: ["5432:5432"]
    volumes: [mall-data:/var/lib/postgresql/data]
  frontend:
    image: node:22-alpine
    working_dir: /workspace
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports: ["5173:5173"]
    volumes:
      - ./frontend:/workspace
      - frontend-node-modules:/workspace/node_modules
    environment:
      PRICING_API_TARGET: http://pricing-agent:8000
      APRIORI_API_TARGET: http://apriori-service:8000
      RECOMMENDER_API_TARGET: http://recommender-service:8000
volumes:
  mall-data:
  frontend-node-modules:
