<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A smarter way to understand and manage your mall."
    />
    <meta name="theme-color" content="#f6f7fb" />
    <title>MallIQ — Intelligent Mall System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <a class="brand" id="brand-home" href="#" aria-label="MallIQ home">
          <span class="brand-mark">M</span>
          <span class="brand-name">Mall<span>IQ</span></span>
        </a>
        <div class="workspace-label">WORKSPACE</div>
        <nav class="main-nav" aria-label="Main navigation">
          <button class="nav-item active" data-page="overview">
            <span class="nav-icon">◫</span><span>Overview</span>
          </button>
          <button class="nav-item" data-page="pricing">
            <span class="nav-icon">↗</span><span>Pricing lab</span>
            <span class="nav-pill">AI</span>
          </button>
          <button class="nav-item" data-page="insights">
            <span class="nav-icon">▦</span><span>Basket insights</span>
          </button>
          <button class="nav-item" data-page="recommendations">
            <span class="nav-icon">✳</span><span>Recommendations</span>
          </button>
          <button class="nav-item" data-page="customers">
            <span class="nav-icon">♙</span><span>Customers</span>
          </button>
          <button class="nav-item" data-page="products">
            <span class="nav-icon">▤</span><span>Products</span>
          </button>
          <button class="nav-item" data-page="transactions">
            <span class="nav-icon">↔</span><span>Transactions</span>
          </button>
          <button class="nav-item" data-page="accounts">
            <span class="nav-icon">◎</span><span>Accounts &amp; roles</span>
          </button>
        </nav>
        <div class="sidebar-spacer"></div>
        <div class="sidebar-help">
          <div class="help-spark">✦</div>
          <strong>Your mall, in sync.</strong>
          <p>Turn everyday data into better experiences.</p>
          <span class="help-tag">INTELLIGENCE, BUILT IN</span>
        </div>
        <div class="profile">
          <button class="profile-open" id="profile-open" aria-label="Open current account">
            <span class="avatar" id="sidebar-avatar">MA</span>
            <span class="profile-copy"><strong id="sidebar-name">Mall Administrator</strong><span id="sidebar-role">Mall administrator</span></span>
          </button>
          <button class="profile-menu" id="sign-out" aria-label="Sign out" title="Sign out">↪</button>
        </div>
      </aside>

      <main class="main-content">
        <header class="topbar">
          <div class="breadcrumbs"><span>Workspace</span><span class="crumb-slash">/</span><strong id="current-section">Overview</strong></div>
          <div class="topbar-actions">
            <div class="system-status"><span class="status-dot" id="status-dot"></span><span id="status-label">Checking services</span></div>
            <button class="icon-button" id="notifications-button" aria-label="Open notifications" aria-expanded="false" aria-controls="notification-popover">♧<i id="notification-indicator" hidden></i></button>
            <button class="topbar-avatar" id="account-shortcut" aria-label="Current account">MA</button>
          </div>
        </header>
        <section class="notification-popover" id="notification-popover" aria-label="Notifications" hidden>
          <div class="notification-heading"><div><strong>Notifications</strong><span id="notification-summary">Checking pending activity…</span></div><button class="text-button" id="mark-notifications-read">Mark all read</button></div>
          <div id="notification-list" class="notification-list"></div>
          <button class="notification-footer" id="notification-view-all">Review pending orders <span>→</span></button>
        </section>
        <div id="page-content" class="page-content"></div>
        <footer class="page-footer">
          <span>© 2026 MallIQ Intelligence</span>
          <span><span class="footer-dot"></span> Built for better mall experiences</span>
        </footer>
      </main>
    </div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
