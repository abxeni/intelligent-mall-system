apiVersion: apps/v1
kind: Deployment
metadata:
  name: apriori-service
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels: { app: apriori-service }
  template:
    metadata: { labels: { app: apriori-service } }
    spec:
      containers:
        - name: apriori-service
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          ports: [{ containerPort: 8000 }]
          readinessProbe: { httpGet: { path: /health, port: 8000 } }
---
apiVersion: v1
kind: Service
metadata:
  name: apriori-service
spec:
  selector: { app: apriori-service }
  ports: [{ port: 8000, targetPort: 8000 }]

